
name: Build DupeClient

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Extract source
        run: unzip DupeClient-1.0-Viet-hoa-source.zip

      - name: Build mod
        run: |
          cd DupeClient-1.0
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DupeClient-JAR
          path: DupeClient-1.0/build/libs/*.jar
          
